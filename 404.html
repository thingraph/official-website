<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      ;(function () {
        var path = location.pathname
        var full = path + location.search + location.hash

        // Shell entry points — avoid redirect loops.
        if (path === '/index.html' || path === '/app/index.html') {
          return
        }

        // CAD portal SPA lives under /app/ (GitHub Pages has no rewrite rules).
        if (path === '/app' || path.indexOf('/app/') === 0) {
          sessionStorage.setItem('spa-path', full)
          location.replace(location.origin + '/app/index.html')
          return
        }

        // Official website SPA (history mode).
        sessionStorage.setItem('spa-path', full)
        location.replace(location.origin + '/')
      })()
    </script>
  </head>
  <body></body>
</html>
